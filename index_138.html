<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1b14">
<title>Le Six Café Manager</title>
<style>
:root {
  --espresso: #2a1b14; --espresso-2: #3a271d; --cream: #f7f1e6; --paper: #fffdf9; --line: #e9dfcf;
  --brass: #b5832f; --brass-d: #96691f; --terra: #b4532a; --olive: #55693a; --ink: #2b2118; --muted: #8a7a68;
  --danger: #b3261e; --warn-bg: #fdf0d9; --ok-bg: #e8f0dc; --bad-bg: #fbe4df;
  --radius: 14px; --shadow: 0 1px 2px rgba(42,27,20,.06), 0 6px 20px rgba(42,27,20,.06);
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sidebar: 262px;
}
html[lang="ar"] { --font-body: 'Cairo', 'Segoe UI', Tahoma, sans-serif; --font-display: 'Cairo', 'Segoe UI', sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-body); background: var(--cream); color: var(--ink); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; font-weight: 600; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Login ---------- */
.login { min-height: 100%; display: grid; grid-template-columns: 1.1fr 1fr; }
.login-art { background: radial-gradient(1200px 600px at 20% 10%, #4a3023 0%, var(--espresso) 60%); color: #f3e7d3; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.login-art::after { content: ""; position: absolute; inset-inline-end: -120px; bottom: -120px; width: 420px; height: 420px; border: 1px solid rgba(181,131,47,.35); border-radius: 50%; box-shadow: 0 0 0 60px rgba(181,131,47,.06), 0 0 0 120px rgba(181,131,47,.04); }
.logo-mark { display: flex; align-items: center; gap: 14px; }
.logo-six { width: 52px; height: 52px; border-radius: 14px; background: var(--brass); color: var(--espresso); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 30px; flex: none; overflow: hidden; }
.logo-six img { width: 100%; height: 100%; object-fit: cover; }
.login-art h1 { font-size: clamp(34px, 4vw, 54px); line-height: 1.05; max-width: 14ch; }
.login-art p { color: #cdbca3; max-width: 38ch; }
.login-form-wrap { display: grid; place-items: center; padding: 32px 20px; background: var(--paper); }
.login-card { width: 100%; max-width: 380px; }
.login-card h2 { font-size: 30px; margin-bottom: 4px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
.field > label, .lbl { font-size: 13px; font-weight: 600; color: #5d4e3f; }
.input, .select, textarea.input { width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; min-height: 44px; }
.input:focus, .select:focus { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(181,131,47,.18); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1.5px solid transparent; font-weight: 600; background: var(--espresso); color: #fff; transition: transform .05s, background .15s; }
.btn:hover { background: var(--espresso-2); } .btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brass); color: #231710; } .btn.primary:hover { background: var(--brass-d); color: #fff; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); } .btn.ghost:hover { background: #f3ebdc; }
.btn.danger { background: transparent; border-color: #e7c4bf; color: var(--danger); } .btn.danger:hover { background: var(--bad-bg); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.block { width: 100%; margin-top: 22px; }
.btn:focus-visible, .nav a:focus-visible, .tab:focus-visible { outline: 3px solid rgba(181,131,47,.5); outline-offset: 2px; }
.error-msg { background: var(--bad-bg); color: var(--danger); padding: 10px 12px; border-radius: 10px; margin-top: 16px; font-size: 14px; }
.demo { margin-top: 26px; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
.demo button { background: none; border: 0; padding: 3px 0; color: var(--brass-d); text-decoration: underline; text-align: start; display: block; }
.lang-switch { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.lang-switch button { color: var(--ink); border: 0; background: transparent; padding: 7px 12px; font-weight: 600; min-height: 36px; }
.lang-switch button.on { background: var(--espresso); color: #fff; }
.topbar-m .lang-switch button.on, .side-foot .lang-switch button.on { background: var(--brass); color: #231710; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar { background: var(--espresso); color: #e8dcc8; display: flex; flex-direction: column; padding: 22px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar .brand { display: flex; gap: 12px; align-items: center; padding: 4px 8px 22px; }
.sidebar .brand b { font-family: var(--font-display); font-size: 19px; line-height: 1.1; color: #fff; display: block; }
.sidebar .brand small { color: #b9a78d; font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #d8c9b1; text-decoration: none; font-weight: 500; min-height: 44px; }
.nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav a.active { background: var(--brass); color: #231710; font-weight: 700; }
.nav a .nl { flex: 1; }
.nav a .ic { width: 22px; text-align: center; font-size: 17px; flex: none; }
.nav a .soon { margin-inline-start: auto; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; border: 1px solid currentColor; border-radius: 6px; padding: 1px 5px; }
.side-foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid rgba(255,255,255,.1); }
.me { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brass); color: #231710; display: grid; place-items: center; font-weight: 700; flex: none; }
.me b { display: block; color: #fff; font-size: 14px; } .me small { color: #b9a78d; }
.side-foot .btn { width: 100%; background: rgba(255,255,255,.08); } .side-foot .btn:hover { background: rgba(255,255,255,.16); }
.side-foot .lang-switch { margin-bottom: 10px; width: 100%; } .side-foot .lang-switch button { flex: 1; }
.main { min-width: 0; padding: 28px 34px 60px; }
.topbar-m { display: none; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
.page-head h1 { font-size: 32px; }
.page-head .sub { color: var(--muted); margin-top: 2px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .input, .toolbar .select { width: auto; min-width: 150px; }
.toolbar .grow { flex: 1; min-width: 180px; }

/* ---------- Cards / stats ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.card h3 { font-size: 18px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
.stat { position: relative; overflow: hidden; }
.stat .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.stat .v { font-family: var(--font-display); font-size: 30px; font-weight: 600; margin-top: 6px; white-space: nowrap; }
.stat .s { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.stat::before { content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--brass)); }
.stat.profit { background: var(--espresso); color: #fff; border-color: var(--espresso); } .stat.profit .k, .stat.profit .s { color: #cdbca3; }
.stat .v.neg { color: #ff9b8f; }
.grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

/* Chart */
.chart { width: 100%; height: 230px; display: block; }
.chart text { font-family: var(--font-body); fill: var(--muted); font-size: 11px; }
.chart .val { fill: var(--ink); font-weight: 600; }
.bar-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.bar-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.bar-track { height: 8px; border-radius: 6px; background: #efe6d6; overflow: hidden; } .bar-fill { height: 100%; border-radius: 6px; background: var(--c, var(--brass)); }
.list { list-style: none; margin: 0; padding: 0; } .list li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; } .list li:last-child { border: 0; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: #3d5224; } .badge.low { background: var(--bad-bg); color: var(--danger); } .badge.off { background: #ece6dc; color: #6e6254; }
.badge.warn { background: var(--warn-bg); color: #8a5a10; }
.badge.mv-purchase { background: var(--ok-bg); color: #3d5224; } .badge.mv-sale { background: #e5ecf3; color: #2e4a66; } .badge.mv-adjustment { background: var(--warn-bg); color: #8a5a10; } .badge.mv-waste { background: var(--bad-bg); color: var(--danger); } .badge.mv-return { background: #ece4f3; color: #5a3f78; }
.alert { background: var(--bad-bg); color: #7d1f19; border: 1px solid #efc3bd; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; font-weight: 600; }

/* Tables */
.table-wrap { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: start; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 12px 14px; background: #f5eddf; white-space: nowrap; }
td { padding: 12px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:hover td { background: #fbf6ec; }
td.r, th.r { text-align: end; } td.act { white-space: nowrap; text-align: end; }
.prod-cell { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.thumb { width: 44px; height: 44px; border-radius: 12px; background: #f1e6d1; display: grid; place-items: center; font-size: 24px; overflow: hidden; flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.pos { color: var(--olive); font-weight: 600; } .neg { color: var(--danger); font-weight: 600; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.tabs { display: inline-flex; gap: 4px; background: #efe6d6; padding: 4px; border-radius: 12px; margin-bottom: 16px; }
.tab { border: 0; background: transparent; padding: 9px 16px; border-radius: 9px; font-weight: 600; color: #6e5f4e; min-height: 40px; }
.tab.on { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.cat-card { display: flex; gap: 14px; align-items: center; }
.cat-card .ico { width: 54px; height: 54px; border-radius: 14px; background: #f1e6d1; display: grid; place-items: center; font-size: 28px; flex: none; }
.cat-card .nm { font-weight: 700; } .cat-card .ar { font-size: 14px; color: var(--muted); }
.cat-card .row-act { margin-inline-start: auto; display: flex; gap: 6px; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(30,18,12,.55); display: grid; place-items: center; padding: 16px; z-index: 50; animation: fade .15s; }
.modal { background: var(--paper); width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow-y: auto; border-radius: 18px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal h2 { font-size: 24px; margin-bottom: 4px; }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.switch { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--brass-d); }
.img-pick { display: flex; gap: 12px; align-items: center; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.preview-box { background: #f5eddf; border-radius: 10px; padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-top: 14px; }
.preview-box b { display: block; font-size: 16px; } .preview-box small { color: var(--muted); }
.toast { position: fixed; bottom: 86px; inset-inline: 0; margin: auto; width: max-content; max-width: 90vw; background: var(--espresso); color: #fff; padding: 12px 20px; border-radius: 12px; z-index: 80; box-shadow: var(--shadow); animation: fade .2s; }
.toast.err { background: var(--danger); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.coming { text-align: center; padding: 70px 20px; } .coming .big { font-size: 56px; }

/* ---------- Mobile bottom nav ---------- */
.bottom-nav { display: none; }
.sheet { position: fixed; inset: 0; z-index: 60; background: rgba(30,18,12,.5); display: flex; align-items: flex-end; }
.sheet-body { background: var(--paper); width: 100%; border-radius: 20px 20px 0 0; padding: 18px 14px 26px; max-height: 80vh; overflow-y: auto; }
.sheet-body .nav a { color: var(--ink); } .sheet-body .nav a:hover { background: #f3ebdc; } .sheet-body .nav a.active { color: #231710; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) { .stats { grid-template-columns: repeat(2, 1fr); } .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr; } }
@media (max-width: 1024px) { :root { --sidebar: 84px; } .sidebar .brand div, .nav a span.nl, .nav a .soon, .me div, .side-foot .btn span { display: none; } .nav a { justify-content: center; } .sidebar .brand { justify-content: center; padding-inline: 0; } .me { justify-content: center; } .main { padding: 22px 20px 60px; } }
@media (max-width: 760px) {
  .login { grid-template-columns: 1fr; } .login-art { display: none; }
  .shell { display: block; } .sidebar { display: none; }
  .topbar-m { display: flex; position: sticky; top: 0; z-index: 30; align-items: center; justify-content: space-between; gap: 10px; background: var(--espresso); color: #fff; padding: 10px 14px; }
  .topbar-m .logo-six { width: 36px; height: 36px; font-size: 20px; border-radius: 10px; } .topbar-m b { font-family: var(--font-display); font-size: 17px; }
  .topbar-m .brand { display: flex; gap: 10px; align-items: center; }
  .main { padding: 16px 14px 100px; } .page-head h1 { font-size: 26px; }
  .stats { grid-template-columns: 1fr 1fr; gap: 10px; } .stat .v { font-size: 21px; } .stat { padding: 14px; }
  .bottom-nav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; bottom: 0; inset-inline: 0; background: var(--paper); border-top: 1px solid var(--line); z-index: 40; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .bottom-nav a, .bottom-nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 6px 2px; border: 0; background: none; border-radius: 10px; min-height: 52px; }
  .bottom-nav .ic { font-size: 20px; } .bottom-nav .active { color: var(--brass-d); background: #f6ecd8; }
  .modal .row { grid-template-columns: 1fr; }
  .toolbar .input, .toolbar .select { flex: 1; min-width: 120px; }
  /* tables → stacked cards */
  .table-wrap { background: transparent; border: 0; box-shadow: none; overflow: visible; }
  table, tbody, tr, td { display: block; } thead { display: none; }
  tr { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  td { border: 0; padding: 5px 0; display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: end; }
  td::before { content: attr(data-label); color: var(--muted); font-size: 12.5px; font-weight: 600; text-align: start; }
  td.first { display: block; text-align: start; padding-bottom: 8px; } td.first::before { content: none; }
  td.act { justify-content: flex-end; padding-top: 10px; } td.act::before { content: none; }
  tr:hover td { background: transparent; }
}

</style>
</head>
